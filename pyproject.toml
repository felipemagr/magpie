[project]
name = "magpie"
version = "0.1.0"
description = "Sort a folder of images into your own categories, fully local"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "rich>=13.9",
    "typer>=0.15",
]

[project.scripts]
magpie = "magpie.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/magpie"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
extend-exclude = [".claude", "*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
